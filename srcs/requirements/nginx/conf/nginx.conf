server {
    # 1. Escucha en el puerto 80 (tráfico web normal)
    listen 80;

	# nombre del dominio
	server_name localhost
    
    # La carpeta raíz donde están los archivos de WordPress
    root /var/www/html;
    
    # Los archivos que buscará por defecto al entrar a la web
    index index.php index.html;

    # Qué hacer con las peticiones normales (imágenes, texto, carpetas)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Qué hacer cuando detecta un archivo .php (¡La conexión!)
    location ~ \.php$ {
		# Incluye la configuracion estandar de FastCGI de Nginx
        include snippets/fastcgi-php.conf;
        
        # Le pasa la petición al contenedor de WordPress en el puerto 9000
        fastcgi_pass wordpress:9000; 
    }
}