server {
    # Listen in the port 443
    listen 443 ssl;
	listen [::]:443 ssl;

	# Domain name
	server_name patquesa.42.fr;

	# Paths to the certificates generated by your Dockerfile
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

	# The only permitted security protocols by subject
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Root folder of the WordPress files
    root /var/www/html;
    # The files it will search for by default when entering the website
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # What to do when it detects a .php file
    location ~ \.php$ {
		# Includes the standard Nginx FastCGI configuration
        include snippets/fastcgi-php.conf;
        # It passes the request to the WordPress container on port 9000
        fastcgi_pass wordpress:9000; 
    }
}